apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gainserv-default-deny
  namespace: gainserv
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gainserv-allow-http
  namespace: gainserv
spec:
  podSelector:
    matchLabels:
      app: gainserv-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access-gainserv: "true"
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gainserv-allow-dns
  namespace: gainserv
spec:
  podSelector:
    matchLabels:
      app: gainserv-app
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
